<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Control - Панель мониторинга</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="static/css-main.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body>
    <div class="sidebar">
        <a href="./app-main.html" class="nav-icon active" title="Аномалии">
            <i class="fas fa-exclamation-triangle"></i>
        </a>
        <a href="./hisroty.html" class="nav-icon" title="Мониторинг">
            <i class="fas fa-chart-line"></i>
        </a>
        <a href='./root.html' class="nav-icon" title="Пользователь">
            <i class="fas fa-user"></i>
        </a>
    </div>

    <div class="main-content">
        <div class="chart-container-2">
            <h2>Мониторинг напряжения</h2>
        </div>
        
        <div class="status-cards">
            <div class="status-card">
                <div class="status-title">Текущее напряжение</div>
                <div class="status-value">219.8 В</div>
            </div>
            <div class="status-card warning">
                <div class="status-title">Выполнено проверок сегодня</div>
                <div class="status-value">3</div>
            </div>
            <div class="status-card danger">
                <div class="status-title">Аномалий обнаружено</div>
                <div class="status-value">1</div>
            </div>
        </div>
        
        <div class="anomalies-list" id = "anomalies-list"></div>
    </div>

    <script src="./utils.js"></script>
    <!-- <script src="./install.js"></script>
    <script src="./service-worker.js"></script>
    <script src="./reg.js"></script> -->
</body>
</html>
