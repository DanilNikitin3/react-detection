
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergyInsight | Мониторинг напряжения</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C63FF;
            --primary-gradient: linear-gradient(135deg, #6C63FF 0%, #4A43C9 100%);
            --secondary: #2C2C54;
            --accent: #36D6E7;
            --accent-gradient: linear-gradient(135deg, #36D6E7 0%, #2AA9B8 100%);
            --success: #2ED573;
            --warning: #FF9F43;
            --danger: #FF6B6B;
            --dark: #1E1E2C;
            --light: #F8F9FC;
            --gray: #8A8A9E;
            --card-bg: #FFFFFF;
            --sidebar-width: 85px;
            --expanded-width: 260px;
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            --card-padding: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffffff 0%, #ffffff 100%);
            color: var(--secondary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        
        /* Сайдбар компактный */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--dark);
            color: white;
            position: fixed;
            height: 100vh;
            transition: var(--transition);
            z-index: 1000;
            box-shadow: var(--shadow);
            overflow: hidden;
        }


        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon {
            font-size: 28px;
            color: var(--accent);
        }

        .sidebar-menu {
            padding: 20px 0;
        }

        .sidebar-menu ul {
            list-style: none;
            padding: 0;
        }

        .sidebar-menu li {
            margin-bottom: 5px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 20px 25px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: var(--transition);
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .sidebar-menu i {
            margin-right: 15px;
            font-size: 1.3rem;
            min-width: 25px;
            text-align: center;
        }

        .menu-text {
            display: none;
        }

        .sidebar:hover .menu-text {
            display: inline-block;
        }


        /* Основной контент */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 30px;
            transition: var(--transition);
        }

        .tablo {
            background-color: var(--secondary);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 10px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-light);
        }


        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px 30px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            background: linear-gradient(135deg, var(--card-bg) 0%, #FDFDFE 100%);
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .header-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            background: var(--light);
            color: var(--secondary);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(108, 99, 255, 0.2);
        }

        /* Контейнер для переключения периодов */
        .period-container {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 28px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--card-bg) 0%, #FDFDFE 100%);
        }

        .period-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .period-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .period-switcher {
            display: flex;
            background: var(--light);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .period-btn {
            padding: 12px 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            color: var(--gray);
            position: relative;
            z-index: 1;
        }

        .period-btn.active {
            color: white;
        }

        .slider {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            background: var(--primary-gradient);
            border-radius: 12px;
            transition: var(--transition);
        }

        .month-active ~ .slider {
            left: 50%;
        }

        /* Контентная область */
        .content-area {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .welcome-message {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }

        .welcome-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            color: var(--primary);
            opacity: 0.7;
        }

        .welcome-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--secondary);
        }

        .welcome-text {
            color: var(--gray);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Контейнеры для графиков */
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chart-box {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            background: linear-gradient(135deg, var(--card-bg) 0%, #FDFDFE 100%);
        }

        .chart-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-title i {
            color: var(--primary);
        }

        .chart-canvas {
            width: 100%;
            height: 300px;
        }

        /* Адаптивность */
        @media (max-width: 992px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 0;
                z-index: 1000;
            }
            
            .sidebar:hover {
                width: var(--expanded-width);
            }
            
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
            
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            
            .header-actions {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .menu-toggle {
                display: block;
                position: fixed;
                top: 20px;
                left: 20px;
                z-index: 1100;
                background: var(--primary);
                color: white;
                width: 50px;
                height: 50px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
         <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><i class="fas fa-bolt"></i></div>
            </div>
            <div class="sidebar-menu">
                <ul>
                    <li><a href="#" class="active">
                        <i class="fas fa-home"></i> 
                    </a></li>
                    <li><a href="#">
                        <i class="fas fa-bolt"></i> 
                    </a></li>
                    <li><a href="#">
                        <i class="fas fa-chart-line"></i> 
                    </a></li>
                </ul>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <h1 class="header-title">Мониторинг аномалий напряжения</h1>
                <div class="user-info">
                    <div class = 'tablo'>
                        <img src="https://ui-avatars.com/api/?name=ON&background=06c000&color=fff" alt="User">
                        <div class="user-details">
                            <div class="user-name">Bluetooth</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="period-container">
                <div class="period-header">
                    <h2 class="period-title">Статистика напряжения</h2>
                    <div class="period-switcher">
                        <button class="period-btn week-active active" id="week-btn">Неделя</button>
                        <button class="period-btn month-active" id="month-btn">Месяц</button>
                        <div class="slider"></div>
                    </div>
                </div>
                
                <div class="content-area" id="content-area">
                    <div class="welcome-message">
                        <i class="fas fa-chart-line welcome-icon"></i>
                        <h3 class="welcome-title">Анализ аномалий напряжения</h3>
                        <p class="welcome-text">Выберите период для отображения статистики. Нажмите на кнопку "Неделя" или "Месяц" для просмотра детальной информации.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Текущее активное представление
        let activeView = 'week';
        
        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            // Обработчики для кнопок переключения
            document.getElementById('week-btn').addEventListener('click', function() {
                handleViewToggle('week');
            });
            
            document.getElementById('month-btn').addEventListener('click', function() {
                handleViewToggle('month');
            });
            
            // Инициализация графиков при первом переключении
            setTimeout(() => {
                handleViewToggle('week');
            }, 500);
        });
        
        // Функция переключения между представлениями
        function handleViewToggle(viewName) {
            // Если кликнули на уже активную кнопку - ничего не делаем
            if (activeView === viewName) return;
            
            // Меняем активную кнопку
            document.getElementById('week-btn').classList.remove('active');
            document.getElementById('month-btn').classList.remove('active');
            document.getElementById(`${viewName}-btn`).classList.add('active');
            
            // Обновляем активное представление
            activeView = viewName;
            
            // Обновляем контент
            renderContent();
        }
        
        // Функция отрисовки контента
        function renderContent() {
            const contentArea = document.getElementById('content-area');
            
            // Анимация исчезновения
            contentArea.style.opacity = 0;
            
            setTimeout(() => {
                if (activeView === 'week') {
                    contentArea.innerHTML = `
                        <div class="charts-container">
                            <div class="chart-box">
                                <h3 class="chart-title"><i class="fas fa-bolt"></i> Напряжение по дням недели</h3>
                                <canvas class="chart-canvas" id="week-voltage-chart"></canvas>
                            </div>
                            <div class="chart-box">
                                <h3 class="chart-title"><i class="fas fa-exclamation-triangle"></i> Аномалии по дням недели</h3>
                                <canvas class="chart-canvas" id="week-anomalies-chart"></canvas>
                            </div>
                        </div>
                    `;
                    
                    // Инициализируем графики после добавления в DOM
                    setTimeout(() => {
                        initWeekCharts();
                        contentArea.style.opacity = 1;
                    }, 50);
                } else if (activeView === 'month') {
                    contentArea.innerHTML = `
                        <div class="charts-container">
                            <div class="chart-box">
                                <h3 class="chart-title"><i class="fas fa-bolt"></i> Напряжение по неделям месяца</h3>
                                <canvas class="chart-canvas" id="month-voltage-chart"></canvas>
                            </div>
                            <div class="chart-box">
                                <h3 class="chart-title"><i class="fas fa-exclamation-triangle"></i> Аномалии по неделям месяца</h3>
                                <canvas class="chart-canvas" id="month-anomalies-chart"></canvas>
                            </div>
                        </div>
                    `;
                    
                    // Инициализируем графики после добавления в DOM
                    setTimeout(() => {
                        initMonthCharts();
                        contentArea.style.opacity = 1;
                    }, 50);
                }
            }, 300);
        }
        
        // Функции инициализации графиков
        function initWeekCharts() {
            // График напряжения за неделю
            const voltageCtx = document.getElementById('week-voltage-chart').getContext('2d');
            new Chart(voltageCtx, {
                type: 'line',
                data: {
                    labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
                    datasets: [{
                        label: 'Напряжение (В)',
                        data: [228, 231, 225, 235, 229, 230, 227],
                        borderColor: '#6C63FF',
                        backgroundColor: 'rgba(108, 99, 255, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#6C63FF',
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
            
            // График аномалий за неделю
            const anomaliesCtx = document.getElementById('week-anomalies-chart').getContext('2d');
            new Chart(anomaliesCtx, {
                type: 'bar',
                data: {
                    labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
                    datasets: [{
                        label: 'Количество аномалий',
                        data: [3, 5, 2, 7, 4, 1, 2],
                        backgroundColor: '#36D6E7',
                        borderRadius: 6,
                        hoverBackgroundColor: '#2AA9B8'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        }
        
        function initMonthCharts() {
            // График напряжения за месяц
            const voltageCtx = document.getElementById('month-voltage-chart').getContext('2d');
            new Chart(voltageCtx, {
                type: 'line',
                data: {
                    labels: ['Неделя 1', 'Неделя 2', 'Неделя 3', 'Неделя 4'],
                    datasets: [{
                        label: 'Среднее напряжение (В)',
                        data: [229, 231, 227, 230],
                        borderColor: '#6C63FF',
                        backgroundColor: 'rgba(108, 99, 255, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#6C63FF',
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
            
            // График аномалий за месяц
            const anomaliesCtx = document.getElementById('month-anomalies-chart').getContext('2d');
            new Chart(anomaliesCtx, {
                type: 'bar',
                data: {
                    labels: ['Неделя 1', 'Неделя 2', 'Неделя 3', 'Неделя 4'],
                    datasets: [{
                        label: 'Количество аномалий',
                        data: [12, 18, 9, 15],
                        backgroundColor: '#FF9F43',
                        borderRadius: 6,
                        hoverBackgroundColor: '#E88C35'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
