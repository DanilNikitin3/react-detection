<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Web Push уведомлений</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        button {
            background: #6C63FF;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <h1>Тестирование Web Push уведомлений</h1>
    
    <div class="container">
        <h2>Статус</h2>
        <div id="status" class="status info">
            Инициализация...
        </div>
        
        <h2>Действия</h2>
        <button id="subscribeBtn" disabled>Подписаться на уведомления</button>
        <button id="testNotificationBtn" disabled>Отправить тестовое уведомление</button>
        <button id="customNotificationBtn" disabled>Отправить кастомное уведомление</button>
        
        <div id="customNotification" style="display: none; margin-top: 20px;">
            <h3>Кастомное уведомление</h3>
            <input type="text" id="notificationTitle" placeholder="Заголовок" value="Кастомный заголовок"><br>
            <textarea id="notificationBody" placeholder="Текст уведомления" rows="3">Это кастомное уведомление!</textarea><br>
            <button id="sendCustomBtn">Отправить</button>
        </div>
    </div>
    
    <script src="./push-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const statusEl = document.getElementById('status');
            const subscribeBtn = document.getElementById('subscribeBtn');
            const testNotificationBtn = document.getElementById('testNotificationBtn');
            const customNotificationBtn = document.getElementById('customNotificationBtn');
            const customNotification = document.getElementById('customNotification');
            const sendCustomBtn = document.getElementById('sendCustomBtn');
            
            // Проверка поддержки браузером
            if (!window.pushNotifier.isSupported) {
                statusEl.textContent = 'Web Push не поддерживается вашим браузером';
                statusEl.className = 'status error';
                return;
            }
            
            // Инициализация
            try {
                const initialized = await window.pushNotifier.init();
                
                if (initialized) {
                    statusEl.textContent = 'Готов к работе!';
                    statusEl.className = 'status success';
                    
                    subscribeBtn.disabled = false;
                    testNotificationBtn.disabled = false;
                    customNotificationBtn.disabled = false;
                } else {
                    statusEl.textContent = 'Ошибка инициализации. Проверьте консоль для деталей.';
                    statusEl.className = 'status error';
                }
            } catch (error) {
                statusEl.textContent = `Ошибка: ${error.message}`;
                statusEl.className = 'status error';
            }
            
            // Обработчики кнопок
            subscribeBtn.addEventListener('click', async () => {
                try {
                    statusEl.textContent = 'Запрос разрешения...';
                    statusEl.className = 'status info';
                    
                    await window.pushNotifier.subscribe();
                    
                    statusEl.textContent = 'Подписка успешно оформлена!';
                    statusEl.className = 'status success';
                } catch (error) {
                    statusEl.textContent = `Ошибка подписки: ${error.message}`;
                    statusEl.className = 'status error';
                }
            });
            
            testNotificationBtn.addEventListener('click', async () => {
                statusEl.textContent = 'Отправка тестового уведомления...';
                statusEl.className = 'status info';
                
                const result = await window.pushNotifier.sendTestNotification();
                
                if (result) {
                    statusEl.textContent = 'Тестовое уведомление отправлено!';
                    statusEl.className = 'status success';
                } else {
                    statusEl.textContent = 'Ошибка отправки уведомления';
                    statusEl.className = 'status error';
                }
            });
            
            customNotificationBtn.addEventListener('click', () => {
                customNotification.style.display = customNotification.style.display === 'none' ? 'block' : 'none';
            });
            
            sendCustomBtn.addEventListener('click', async () => {
                const title = document.getElementById('notificationTitle').value;
                const body = document.getElementById('notificationBody').value;
                
                try {
                    const response = await fetch('/api/send-notification', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            title: title || 'Кастомное уведомление',
                            body: body || 'Это кастомное уведомление!',
                            icon: '/icon-192.png'
                        })
                    });
                    
                    if (response.ok) {
                        statusEl.textContent = 'Кастомное уведомление отправлено!';
                        statusEl.className = 'status success';
                    } else {
                        throw new Error('Ошибка сервера');
                    }
                } catch (error) {
                    statusEl.textContent = 'Ошибка отправки кастомного уведомления';
                    statusEl.className = 'status error';
                }
            });
        });
    </script>
</body>
</html>
